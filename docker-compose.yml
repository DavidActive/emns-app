# Run eMNS on any machine with Docker, against a local PostgreSQL, with the MOCK providers (nothing is ever sent).
#   node scripts/gen-env.cjs              # once: writes .env.docker with random secrets
#   docker compose --env-file .env.docker up --build
#   open http://localhost:8080            # sign in as admin@emns.local with SEED_ADMIN_PASSWORD from .env.docker
# Components: PostgreSQL, PostgREST (data API) and GoTrue (sign-in) as open-source services, the eMNS app, the scheduler, and an nginx front door.
# Image tags can be overridden in .env.docker (POSTGRES_IMAGE, POSTGREST_IMAGE, GOTRUE_IMAGE).
name: emns

x-app-env: &app-env
  SUPABASE_URL: http://gateway
  SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?run node scripts/gen-env.cjs}
  EMNS_WORKER_SECRET: ${EMNS_WORKER_SECRET:?run node scripts/gen-env.cjs}
  EMNS_BASE_URL: ${EMNS_PUBLIC_URL:-http://localhost:8080}
  EMNS_INTERNAL_URL: http://app:8080
  TWILIO_WEBHOOK_BASE_URL: ${EMNS_PUBLIC_URL:-http://localhost:8080}
  EMNS_MESSAGE_PROVIDER: mock
  EMNS_EMAIL_PROVIDER: mock
  EMNS_VOICE_PROVIDER: mock
  EMNS_ALLOW_REAL_SEND: "false"
  EMNS_AUTH_PROVIDER: ${EMNS_AUTH_PROVIDER:-supabase}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run node scripts/gen-env.cjs}", POSTGRES_DB: postgres }
    volumes: [ "db-data:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped

  bootstrap:
    build: { context: ., target: runtime }
    image: emns:local
    command: ["node", "scripts/db-local.cjs", "bootstrap"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  auth:
    image: ${GOTRUE_IMAGE:-supabase/gotrue:v2.174.0}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${EMNS_PUBLIC_URL:-http://localhost:8080}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${EMNS_PUBLIC_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${EMNS_PUBLIC_URL:-http://localhost:8080}/**
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@emns.local
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    restart: unless-stopped

  rest:
    image: ${POSTGREST_IMAGE:-postgrest/postgrest:v12.2.12}
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    restart: unless-stopped

  migrate:
    image: emns:local
    command: ["node", "scripts/db-local.cjs", "migrate"]
    environment: { DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres" }
    depends_on: { bootstrap: { condition: service_completed_successfully }, auth: { condition: service_started }, rest: { condition: service_started } }
    restart: "no"

  gateway:
    build: { context: ., dockerfile: Dockerfile.gateway }
    environment: { UPSTREAM_APP: "app:8080", UPSTREAM_REST: "rest:3000", UPSTREAM_AUTH: "auth:9999" }
    ports: [ "8080:80" ]
    depends_on: [ app ]
    restart: unless-stopped

  app:
    image: emns:local
    environment:
      <<: *app-env
      EMNS_PUBLIC_SUPABASE_URL: ${EMNS_PUBLIC_URL:-http://localhost:8080}
      EMNS_PUBLIC_SUPABASE_KEY: ${ANON_KEY}
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  worker:
    image: emns:local
    command: ["node", "server/worker.cjs"]
    environment:
      <<: *app-env
      EMNS_SWEEP_SECONDS: "15"
    depends_on: { app: { condition: service_started }, gateway: { condition: service_started } }
    restart: unless-stopped

  seed:
    image: emns:local
    command: ["node", "scripts/db-local.cjs", "seed"]
    environment:
      <<: *app-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@emns.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?run node scripts/gen-env.cjs}
    depends_on: { gateway: { condition: service_started }, migrate: { condition: service_completed_successfully } }
    restart: "no"

  mailpit:   # catches the invitation emails sent by sign-in; view them at http://localhost:8025
    image: axllent/mailpit:v1.21
    ports: [ "8025:8025" ]
    restart: unless-stopped

volumes:
  db-data:
